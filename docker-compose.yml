services:
  postgres:
    image: postgres:16-alpine
    container_name: ticket-postgres
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
      POSTGRES_DB: ticket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticket"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-1:
    image: redis:7-alpine
    container_name: ticket-redis-1
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis-2:
    image: redis:7-alpine
    container_name: ticket-redis-2
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis-3:
    image: redis:7-alpine
    container_name: ticket-redis-3
    ports:
      - "6381:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    container_name: ticket-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 25s

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: ticket-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        TOPICS="ticket.booking.requested ticket.seat.hold.requested ticket.seat.held ticket.seat.hold.failed ticket.payment.completed ticket.payment.failed ticket.booking.status ticket.dead-letter"
        for topic in $$TOPICS; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $$topic --partitions 6 --replication-factor 1
        done
        echo "kafka topics ready"

  gateway:
    profiles: ["apps"]
    build: .
    container_name: ticket-gateway
    environment:
      HTTP_PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ticket
      DB_PASSWORD: ticket
      DB_NAME: ticket
      DB_SYNCHRONIZE: "true"
      REDIS_URLS: redis://redis-1:6379,redis://redis-2:6379,redis://redis-3:6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: ticket-gateway
      PAYMENT_PROVIDER: fake
      FAKE_PAYMENT_MODE: success
      FAKE_PAYMENT_DELAY_MS: 20
      SEED_ON_BOOT: "true"
      SEED_SEAT_COUNT: 100
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  booking-worker:
    profiles: ["apps"]
    build: .
    command: ["node", "dist/worker.main.js"]
    environment: &worker-env
      WORKER_ROLE: booking
      WORKER_PORT: 3001
      KAFKA_CLIENT_ID: ticket-booking
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ticket
      DB_PASSWORD: ticket
      DB_NAME: ticket
      DB_SYNCHRONIZE: "false"
      REDIS_URLS: redis://redis-1:6379,redis://redis-2:6379,redis://redis-3:6379
      KAFKA_BROKERS: kafka:29092
      PAYMENT_PROVIDER: fake
      FAKE_PAYMENT_MODE: success
      FAKE_PAYMENT_DELAY_MS: 20
      SEED_ON_BOOT: "false"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  seat-worker:
    profiles: ["apps"]
    build: .
    command: ["node", "dist/worker.main.js"]
    environment:
      <<: *worker-env
      WORKER_ROLE: seat
      WORKER_PORT: 3002
      KAFKA_CLIENT_ID: ticket-seat
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  payment-worker:
    profiles: ["apps"]
    build: .
    command: ["node", "dist/worker.main.js"]
    environment:
      <<: *worker-env
      WORKER_ROLE: payment
      WORKER_PORT: 3003
      KAFKA_CLIENT_ID: ticket-payment
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  notification-worker:
    profiles: ["apps"]
    build: .
    command: ["node", "dist/worker.main.js"]
    environment:
      <<: *worker-env
      WORKER_ROLE: notification
      WORKER_PORT: 3004
      KAFKA_CLIENT_ID: ticket-notification
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  outbox-relay:
    profiles: ["apps"]
    build: .
    command: ["node", "dist/worker.main.js"]
    environment:
      <<: *worker-env
      WORKER_ROLE: outbox
      WORKER_PORT: 3005
      KAFKA_CLIENT_ID: ticket-outbox
      OUTBOX_POLL_MS: 500
      OUTBOX_BATCH_SIZE: 100
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
